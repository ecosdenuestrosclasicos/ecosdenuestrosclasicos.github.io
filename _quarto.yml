project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"
  resources:
    - imagenes/
    - datos/
    - assets/fuentes/
    - assets/giscus-ecos.css

lang: es
date-format: "D [de] MMMM [de] YYYY"

execute:
  freeze: auto
  echo: true
  message: false
  warning: false

website:
  title: "Ecos de nuestros clásicos"
  site-url: "https://ecosdenuestrosclasicos.com"
  description: "Divulgación sobre Grecia y Roma: instituciones, poder, literatura, filosofía y fuentes. Un proyecto de Isabel Sanz."
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: false
  search:
    location: navbar
    type: overlay
  navbar:
    title: "Ecos de nuestros clásicos"
    collapse-below: lg
    left:
      - text: "Sobre Ecos"
        menu:
          - text: "El proyecto"
            href: proyecto.qmd
          - text: "Soy Isabel Sanz"
            href: sobre-mi.qmd
          - text: "El libro"
            href: libro.qmd
      - text: "Biblioteca"
        menu:
          - text: "Todo el archivo"
            href: biblioteca.qmd
          - text: "Investigación"
            href: investigacion.qmd
          - text: "Lecturas y fuentes"
            href: lecturas.qmd
          - text: "Vídeos y episodios"
            href: videos.qmd
      - text: "Comunidad"
        href: comunidad.qmd
      - text: "Prensa y colaboraciones"
        href: colaboraciones.qmd
      - text: "Contacto"
        href: contacto.qmd
    tools:
      - icon: heart-fill
        href: apoyame.qmd
        aria-label: "Apoya Ecos"
    right:
      - text: "Apoya Ecos"
        href: apoyame.qmd
        aria-label: "Apoya Ecos en Patreon o PayPal"
  page-footer:
    left: |
      **Ecos de nuestros clásicos**<br>
      Un proyecto de Isabel Sanz, desde Valencia.
    center:
      - text: Instagram
        href: https://www.instagram.com/ecosdenuestrosclasicos/
      - text: YouTube
        href: https://www.youtube.com/@Ecosdenuestrosclásicos
      - text: TikTok
        href: https://www.tiktok.com/@ecosdenuestrosclasicos
      - text: Facebook
        href: https://www.facebook.com/profile.php?id=61586532315391
      - text: Patreon
        href: https://www.patreon.com/cw/Ecosdenuestrosclasicos
      - text: PayPal
        href: https://paypal.me/ecosclasicos
    right: |
      [ecosdenuestrosclasicos@gmail.com](mailto:ecosdenuestrosclasicos@gmail.com)<br>
      [Apoya Ecos](/apoyame.html) · [Privacidad](/privacidad.html)

format:
  html:
    theme:
      light: [cosmo, assets/ecos.scss]
    css: assets/ecos.css
    include-in-header: assets/cabecera.html
    include-after-body:
      - assets/miniodi.html
      - assets/formularios.html
      - assets/apoyo.html
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
    lightbox: true
    fig-cap-location: bottom
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    crossref:
      fig-title: Gráfico
      tbl-title: Tabla

# Los comentarios (giscus) se configuran en investigacion/_metadata.yml,
# lecturas/_metadata.yml y cuadernos/_metadata.yml. Pasos en el README.
